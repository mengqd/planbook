name: Build Windows

# 手动触发：仓库页面 -> Actions -> Build Windows -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 用于自动发布 Release（免登录下载）
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 编译并打包
        # 只打 NSIS 安装包：MSI 依赖 .NET Framework 3.5，GitHub runner 默认没有
        run: npm run tauri build -- --bundles nsis

      - name: 准备发布文件（重命名为 ASCII，避免中文文件名乱码）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          # NSIS 安装包：把开头的「便签」中文前缀换成 planbook，得到 ASCII 文件名
          $setup = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if ($setup) {
            $newName = ($setup.BaseName -replace '^便签', 'planbook') + '.exe'
            Copy-Item -Path $setup.FullName -Destination "publish/$newName"
            Write-Host "安装包 -> $newName"
          }
          # 使用说明 HTML：重命名为 ASCII
          if (Test-Path "使用说明.html") {
            Copy-Item -Path "使用说明.html" -Destination "publish/instructions.html"
            Write-Host "使用说明 -> instructions.html"
          }
          # 便携版：ASCII 名
          if (Test-Path "src-tauri/target/release/planbook.exe") {
            Copy-Item -Path "src-tauri/target/release/planbook.exe" -Destination "publish/planbook-portable.exe"
            Write-Host "便携版 -> planbook-portable.exe"
          }
          Write-Host "--- publish 内容 ---"
          Get-ChildItem publish | ForEach-Object { Write-Host $_.Name }

      - name: 上传安装包（含使用说明）
        uses: actions/upload-artifact@v4
        with:
          name: planbook-windows
          retention-days: 7
          path: publish/*

      - name: 发布到 Release（免登录下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_id }}
          name: Dev 构建（含搜索功能）
          prerelease: true
          files: publish/*
