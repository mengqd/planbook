name: Build Windows

# 手动触发：仓库页面 -> Actions -> Build Windows -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 编译并打包
        # 只打 NSIS 安装包：MSI 依赖 .NET Framework 3.5，GitHub runner 默认没有
        run: npm run tauri build -- --bundles nsis

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: planbook-windows
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/planbook.exe
