[package]
name = "planbook"
version = "0.1.0"
description = "日程本 - 本地日历与每日计划"
authors = ["planbook"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: macOS 下透明窗口所需
# tray-icon: 顶部菜单栏 / 系统托盘常驻图标
# image-png: 从 PNG 字节加载菜单栏模板图标
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
# 用系统默认程序打开文件 / 在文件管理器中显示文件
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
